name: Static Website Deployment

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
      image_digest: ${{ steps.image-digest.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Image Tag
        id: image-tag
        run: |
          echo "image_tag=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Capture image digest
        id: image-digest
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  scan:
    name: Scan Image
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
      FAIL_ON_SEVERITIES: ${{ vars.FAIL_ON_SEVERITIES }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq util-linux

      - name: Wait for ECR scan and check findings
        run: |

          MAX_WAIT=180
          INTERVAL=5
          ELAPSED=0
          SCAN_STATUS=""

          echo "Waiting for ECR scan on $ECR_REPOSITORY@$IMAGE_DIGEST ..."

          while [ $ELAPSED -lt $MAX_WAIT ]; do

            SCAN_STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="$IMAGE_DIGEST" \
              --region "$AWS_REGION" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null | head -n1 | tr -d '[:space:]') || true

            echo "Poll result: [$SCAN_STATUS]"

            if [ "$SCAN_STATUS" = "COMPLETE" ]; then
              echo "Scan complete."
              break

            elif [ "$SCAN_STATUS" = "FAILED" ]; then
              echo "ECR scan failed."
              exit 1

            else
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            fi

          done

          if [ "$SCAN_STATUS" != "COMPLETE" ]; then
            echo "Timed out waiting for scan."
            exit 1
          fi

          FINDINGS_JSON=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="$IMAGE_DIGEST" \
            --region "$AWS_REGION" \
            --output json) || true

          if [ -z "$FINDINGS_JSON" ]; then
            echo "Could not retrieve scan findings."
            exit 1
          fi

          echo ""
          echo "=============================="
          echo " Vulnerability Summary"
          echo "=============================="

          echo "$FINDINGS_JSON" | jq '.imageScanFindings.findingSeverityCounts'

          IS_ENHANCED=$(echo "$FINDINGS_JSON" | jq '(.imageScanFindings.enhancedFindings // []) | length > 0')

          echo ""
          echo "=============================="
          echo " Vulnerability Details"
          echo "=============================="

          if [ "$IS_ENHANCED" = "true" ]; then

            echo "$FINDINGS_JSON" | jq -r '
              ["SEVERITY","CVE","PACKAGE","INSTALLED","FIXED_IN","CVSS","REFERENCE"],
              (.imageScanFindings.enhancedFindings[]? as $f |
                (($f.packageVulnerabilityDetails.vulnerablePackages // [{}])[] ) as $pkg |
                [
                  $f.severity,
                  ($f.packageVulnerabilityDetails.vulnerabilityId // $f.title // "-"),
                  ($pkg.name // "-"),
                  ($pkg.version // "-"),
                  ($pkg.fixedInVersion // "Not Available"),
                  (($f.packageVulnerabilityDetails.cvss[0].baseScore // "-") | tostring),
                  ($f.packageVulnerabilityDetails.sourceUrl // (($f.packageVulnerabilityDetails.referenceUrls // [])[0]) // "-")
                ]
              ) | @tsv
            ' | column -t -s$'\t'

          else

            echo "Basic Scanning Detected"

            echo "$FINDINGS_JSON" | jq -r '
              ["SEVERITY","CVE","PACKAGE","INSTALLED","DESCRIPTION"],
              (.imageScanFindings.findings[]? |
                [
                  .severity,
                  .name,
                  (.attributes[]? | select(.key=="package_name") | .value) // "-",
                  (.attributes[]? | select(.key=="package_version") | .value) // "-",
                  ((.description // "-") |
                    if length > 80
                    then .[0:80] + "..."
                    else .
                    end)
                ]
              ) | @tsv
            ' | column -t -s$'\t'

            echo ""
            echo "=============================="
            echo " Full Descriptions"
            echo "=============================="

            echo "$FINDINGS_JSON" | jq -r '
              .imageScanFindings.findings[]? |
              "\n------------------------------------------\n" +
              .name + " (" + .severity + ")\n\n" +
              "Package : " +
              ((.attributes[]? |
              select(.key=="package_name") |
              .value) // "-") +

              "\nInstalled : " +

              ((.attributes[]? |
              select(.key=="package_version") |
              .value) // "-") +

              "\n\nDescription:\n" +
              (.description // "n/a") +

              "\n\nReference:\n" +
              .uri
            '

          fi

          echo ""
          echo "Generating GitHub Summary..."
          echo ""

          {

            echo "## ECR Scan Findings"
            echo ""
            echo "**Repository:** ${ECR_REPOSITORY}"
            echo ""
            echo "**Image Tag:** ${IMAGE_TAG}"
            echo ""

            if [ "$IS_ENHANCED" = "true" ]; then

              echo "| Severity | CVE | Package | Installed | Fixed In | CVSS | Reference |"
              echo "|----------|-----|---------|------------|-----------|------|-----------|"

              echo "$FINDINGS_JSON" | jq -r '

                .imageScanFindings.enhancedFindings[]? as $f |

                (($f.packageVulnerabilityDetails.vulnerablePackages // [{}])[] ) as $pkg |

                "| " +

                $f.severity +

                " | " +

                ($f.packageVulnerabilityDetails.vulnerabilityId // $f.title // "-") +

                " | " +

                ($pkg.name // "-") +

                " | " +

                ($pkg.version // "-") +

                " | " +

                ($pkg.fixedInVersion // "Not Available") +

                " | " +

                (($f.packageVulnerabilityDetails.cvss[0].baseScore // "-") | tostring) +

                " | " +

                "[Reference](" +

                ($f.packageVulnerabilityDetails.sourceUrl //

                (($f.packageVulnerabilityDetails.referenceUrls // [])[0]) //

                "#") +

                ") |"

              '

              echo ""
              echo "### Full Details"
              echo ""
              echo "$FINDINGS_JSON" | jq -r '

                .imageScanFindings.enhancedFindings[]? as $f |

                "<details><summary><b>" +

                ($f.packageVulnerabilityDetails.vulnerabilityId // $f.title // "-") +

                "</b> (" +

                $f.severity +

                ")</summary>\n\n" +

                "- **Description:** " +

                ($f.description // "n/a") +

                "\n" +

                "- **CVSS:** " +

                (($f.packageVulnerabilityDetails.cvss[0].baseScore // "-") | tostring) +

                "\n" +

                "- **Remediation:** " +

                ($f.remediation.recommendation.text // "See AWS Reference") +

                "\n" +

                "- **Reference:** " +

                ($f.packageVulnerabilityDetails.sourceUrl //

                (($f.packageVulnerabilityDetails.referenceUrls // [])[0]) //

                "-") +

                "\n\n</details>\n"

              '

            else

              echo "| Severity | CVE | Package | Installed | Reference |"
              echo "|----------|-----|---------|------------|-----------|"

              echo "$FINDINGS_JSON" | jq -r '

                .imageScanFindings.findings[]? |

                "| " +

                .severity +

                " | " +

                .name +

                " | " +

                ((.attributes[]? |

                select(.key=="package_name") |

                .value) // "-") +

                " | " +

                ((.attributes[]? |

                select(.key=="package_version") |

                .value) // "-") +

                " | " +

                "[Reference](" +

                .uri +

                ") |"

              '

              echo ""
              echo "### Full Details"
              echo ""

              echo "$FINDINGS_JSON" | jq -r '

                .imageScanFindings.findings[]? |

                "<details><summary><b>" +

                .name +

                "</b> (" +

                .severity +

                ")</summary>\n\n" +

                "- **Description:** " +

                (.description // "n/a") +

                "\n\n" +

                "- **Reference:** " +

                .uri +

                "\n\n</details>\n"

              '

            fi

          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Checking configured severity threshold..."
          echo ""

          BLOCK=0

          for SEV in $FAIL_ON_SEVERITIES
          do

            COUNT=$(echo "$FINDINGS_JSON" | jq --arg SEV "$SEV" \
              '.imageScanFindings.findingSeverityCounts[$SEV] // 0')

            echo "$SEV : $COUNT"

            if [ "$COUNT" -gt 0 ]; then
              BLOCK=1
            fi

          done

          echo ""

          if [ "$BLOCK" -eq 1 ]; then

            echo "Vulnerabilities found at configured threshold."

            echo "Deployment will be blocked."

            exit 1

          else

            echo "No blocking vulnerabilities detected."

            echo "Deployment may continue."

          fi

  deploy:
    needs:
      - build-and-push
      - scan

    runs-on: ubuntu-latest

    outputs:
      task_def_revision: ${{ steps.register-task-def.outputs.revision }}

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image URI independently
        id: image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ steps.image-uri.outputs.uri }}

      - name: Register new task definition revision
        id: register-task-def
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' \
          "${{ steps.render-task-def.outputs.task-definition }}" > cleaned-task-def.json

          echo "----- Cleaned Task Definition -----"
          cat cleaned-task-def.json
          echo "-----------------------------------"

          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://cleaned-task-def.json \
            --query 'taskDefinition.revision' \
            --output text)

          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Deploy to ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }}:${{ steps.register-task-def.outputs.revision }} \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }}

  notify:
    if: always()

    needs:
      - build-and-push
      - scan
      - deploy

    runs-on: ubuntu-latest

    steps:

      - name: Notify Slack - Final Status
        run: |

          BUILD_RESULT="${{ needs.build-and-push.result }}"
          SCAN_RESULT="${{ needs.scan.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [ "$BUILD_RESULT" == "cancelled" ] || \
             [ "$SCAN_RESULT" == "cancelled" ] || \
             [ "$DEPLOY_RESULT" == "cancelled" ]; then

            STATUS="ABORTED"
            COLOR="#f0ad4e"

          elif [ "$BUILD_RESULT" == "success" ] && \
               [ "$SCAN_RESULT" == "success" ] && \
               [ "$DEPLOY_RESULT" == "success" ]; then

            STATUS="SUCCESS"
            COLOR="#36a64f"

          else

            STATUS="FAILURE"
            COLOR="#d9534f"

          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TASK_REV="${{ needs.deploy.outputs.task_def_revision }}"

          MSG_TEXT=$(printf "%s: Job %s\n*Author:* %s\n*Branch:* %s\n*Build Number:* %s\n*Task Definition:* %s\n*Build:* %s\n*Scan:* %s\n*Deploy:* %s" \
            "$STATUS" \
            "${{ github.workflow }}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${{ github.run_number }}" \
            "$TASK_REV" \
            "$BUILD_RESULT" \
            "$SCAN_RESULT" \
            "$DEPLOY_RESULT")

          FALLBACK_TEXT=$(printf "%s: %s Build #%s" \
            "$STATUS" \
            "${{ github.workflow }}" \
            "${{ github.run_number }}")

          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg text "$MSG_TEXT" \
            --arg fallback "$FALLBACK_TEXT" \
            --arg url "$RUN_URL" \
            '{
              attachments: [
                {
                  color: $color,
                  fallback: $fallback,
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: $text
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View Workflow"
                          },
                          url: $url
                        }
                      ]
                    }
                  ]
                }
              ]
            }')

          curl -X POST \
            -H "Content-type: application/json" \
            --data "$PAYLOAD" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
