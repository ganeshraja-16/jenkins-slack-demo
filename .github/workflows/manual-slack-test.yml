name: Static Website Deployment

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      task_def_revision: ${{ steps.register-task-def.outputs.revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image URI independently
        id: image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ steps.image-uri.outputs.uri }}

      - name: Register new task definition revision
        id: register-task-def
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render-task-def.outputs.task-definition }}" > cleaned-task-def.json

          echo "----- Cleaned task definition (for debugging) -----"
          cat cleaned-task-def.json
          echo "-----------------------------------------------------"

          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://cleaned-task-def.json \
            --query 'taskDefinition.revision' --output text)

          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Deploy to ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }}:${{ steps.register-task-def.outputs.revision }} \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }}

  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack - Final Status
        run: |
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [ "$BUILD_RESULT" == "cancelled" ] || [ "$DEPLOY_RESULT" == "cancelled" ]; then
            STATUS="ABORTED"
            COLOR="#f0ad4e"
          elif [ "$BUILD_RESULT" == "success" ] && [ "$DEPLOY_RESULT" == "success" ]; then
            STATUS="SUCCESS"
            COLOR="#36a64f"
          else
            STATUS="FAILURE"
            COLOR="#d9534f"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TASK_REV="${{ needs.deploy.outputs.task_def_revision }}"

          MSG_TEXT=$(printf "%s: Job %s\n*Author Name:* %s\n*Branch name:* %s\n*Build number:* %s\n*Task Definition number:* %s" \
            "$STATUS" \
            "${{ github.workflow }}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${{ github.run_number }}" \
            "$TASK_REV")

          FALLBACK_TEXT=$(printf "%s: Job %s - Build #%s" "$STATUS" "${{ github.workflow }}" "${{ github.run_number }}")

          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg text "$MSG_TEXT" \
            --arg fallback "$FALLBACK_TEXT" \
            --arg url "$RUN_URL" \
            '{
              attachments: [
                {
                  color: $color,
                  fallback: $fallback,
                  blocks: [
                    { type: "section", text: { type: "mrkdwn", text: $text } },
                    { type: "actions", elements: [
                        { type: "button", text: { type: "plain_text", text: "More info" }, url: $url }
                      ]
                    }
                  ]
                }
              ]
            }')

          curl -X POST -H "Content-type: application/json" \
            --data "$PAYLOAD" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
